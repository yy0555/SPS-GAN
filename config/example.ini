# SPS-GAN training. Paths are relative to this INI file.
# See dataset/README.md for sources and the required NPZ format.
[paths]
dataset = ../dataset/pendulum.npz
output = ../output/pendulum

[data]
# Switch the dataset, decoder, discriminators, and objective together.
# trajectory: NPZ key trajectories; video: NPZ key videos.
mode = trajectory
# Generated sequence length and real-data crop length.
num_frames = 30
# Contiguous window evaluated by the critic; 0 uses the full sequence.
discriminator_frames = 16
# Trajectory mode: Cartesian particles per frame, including any masked padding.
max_particles = 1
# Width of supplied conditioning vectors; 0 trains one unconditional system.
conditioning_dim = 0
# Match the time between observations in your prepared dataset.
dt = 0.05

[model]
# Even dimension: first half q, second half p.
latent_dim = 20
# Input motion-code dimension, independent of latent_dim; 0 uses latent_dim.
noise_dim = 10
# Trajectory mode content code. Video mode uses [video] content_dim.
content_dim = 0
# Hidden width shared by the phase-space map and Hamiltonian MLP.
hidden_dim = 100
# Trajectory mode: decoder MLP and recurrent critic widths.
decoder_hidden_dim = 512
discriminator_hidden_dim = 218
# Trajectory mode: include cross-sample features in the critic.
minibatch_discrimination = false

[training]
# cpu, auto, cuda, or cuda:<index>
device = cpu
seed = 72
# Each step performs one discriminator update followed by generator_updates.
steps = 20000
# Trajectory batch size. Video mode uses the smaller [video] batch_size.
batch_size = 128
learning_rate = 0.00005
beta1 = 0.3
beta2 = 0.999
# R1 gradient-penalty coefficient; 0 disables R1.
r1_gamma = 10
# L1 momentum-derivative penalty, summed over time/coordinates, averaged by batch.
cyclic_weight = 0.03
# Trajectory mode: margin for both the real and fake hinge-loss terms.
discriminator_margin = 1.0
generator_updates = 1
# Intervals in training steps. A checkpoint is always saved at the final step.
log_every = 10
save_every = 100

# Used only when [data] mode = video. Shared optimizer/dynamics settings above
# still apply. Video training uses image + video BCE losses and the cyclic loss.
[video]
# The convolutional networks generate 96x96 frames.
image_size = 96
# 1 = grayscale, 3 = RGB; must match the prepared videos.
channels = 3
content_dim = 50
generator_filters = 32
discriminator_filters = 32
batch_size = 16
# BCE targets: real discriminator samples and generated samples in the G loss.
# Fake discriminator samples always use target 0.
real_label = 0.9
generator_label = 1.0
